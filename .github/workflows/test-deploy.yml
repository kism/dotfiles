---
name: test-deploy
on:
  push:
    branches:
      - main
    paths:
      - "setup.sh"
      - "setup_simple.sh"
      - ".zshrc"
      - "setup_simple_generate.sh"
      - ".stow-local-ignore"
      - ".github/workflows/test-deploy.yml"
  pull_request:
    paths:
      - "setup.sh"
      - "setup_simple.sh"
      - ".zshrc"
      - "setup_simple_generate.sh"
      - ".stow-local-ignore"
      - ".github/workflows/test-deploy.yml"

jobs:
  build:
    name: Test Deploy Dotfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run setup script simple generate
        run: bash setup_simple_generate.sh

      - name: Run setup script simple
        run: bash setup_simple.sh
        env:
          BASE: file://${{ github.workspace }} # test this branch, not main

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: zsh git htop tmux curl wget tree ncdu stow software-properties-common gnupg2
          version: 1.0

      - name: Check simple .zshrc
        run: |
          zsh -n ~/.zshrc
          if grep -v '^[[:space:]]*#' ~/.zshrc | grep -E '^(zi |source .*zinit)|starship|get_mercury|load_ssh_keys'; then exit 1; fi # code only, comments may mention them
          # Runner image has group/world-writable fpath dirs, so any plain compinit (Ubuntu's global one, nvm's bash_completion) aborts
          zsh -c 'autoload -U compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod go-w
          out=$(zsh -i -c 'exit 0' </dev/null 2>&1)
          [ -z "$out" ] || { echo "$out"; exit 1; }
        env:
          TERM: xterm-256color # CI has no terminal, real shells always have TERM

      - name: Run setup script
        run: bash setup.sh --no-package-install
        timeout-minutes: 1

  build-macos:
    name: Test Deploy Dotfiles (macOS)
    runs-on: macos-latest # the Darwin branches in setup.sh are never hit on ubuntu
    steps:
      - uses: actions/checkout@v7

      - name: Run setup script simple
        run: bash setup_simple.sh
        env:
          BASE: file://${{ github.workspace }} # test this branch, not main

      - name: Check simple .zshrc
        run: |
          zsh -n ~/.zshrc
          if grep -v '^[[:space:]]*#' ~/.zshrc | grep -E '^(zi |source .*zinit)|starship|get_mercury|load_ssh_keys'; then exit 1; fi # code only, comments may mention them
          out=$(zsh -i -c 'exit 0' </dev/null 2>&1)
          [ -z "$out" ] || { echo "$out"; exit 1; }
        env:
          TERM: xterm-256color # CI has no terminal, real shells always have TERM

      - name: Install stow # so the stow step actually runs instead of being skipped
        run: brew install stow

      - name: Run setup script
        run: bash setup.sh --no-package-install
        timeout-minutes: 5
