---
name: check-windows
on:
  push:
    branches:
      - main
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.psd1"
      - ".github/workflows/check-windows.yml"
  pull_request:
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.psd1"
      - ".github/workflows/check-windows.yml"

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest # only runner that sees Windows-only cmdlets
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error # Warning is noisy on profile scripts
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
          Write-Host "No errors"
