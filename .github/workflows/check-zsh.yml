name: check-zsh
on:
  push:
    branches:
      - main
    paths:
      - ".zshrc"
      - ".local/bin/**"
      - ".github/workflows/check-zsh.yml"
  pull_request:
    paths:
      - ".zshrc"
      - ".local/bin/**"
      - ".github/workflows/check-zsh.yml"

jobs:
  zsh-parse:
    name: zsh parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Shellcheck can't read zsh, so .zshrc is in its ignore list. This is the
      # only thing that catches a syntax error before it breaks a login shell.
      - name: Parse zsh files
        run: |
          zsh --version || sudo apt-get install -y --no-install-recommends zsh
          mapfile -t files < <({ echo .zshrc; git ls-files -z .local/bin | xargs -0 grep -lE '^#!.*[ /]zsh( |$)'; })
          for f in "${files[@]}"; do zsh -n "$f"; done

  zsh-lint:
    name: shfmt + zsh-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shfmt and zsh-lint
        env:
          GOTOOLCHAIN: auto # zsh-lint wants a newer Go than the runner image has
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          go install github.com/z-shell/zsh-lint/cmd/zsh-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Same file selection as __scripts/lint.sh. Only warning/error findings fail zsh-lint.
      - name: Check formatting and lint
        run: |
          mapfile -t files < <({ echo .zshrc; git ls-files -z .local/bin | xargs -0 grep -lE '^#!.*[ /]zsh( |$)'; })
          shfmt -ln zsh -d -i 4 "${files[@]}"
          zsh-lint "${files[@]}"
